name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Migrate db
        run: yarn prisma migrate deploy

      - name: Seed database with dummy data
        run: yarn seed

      - name: Build
        run: yarn build

  deploy:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    needs:
      - build
      - test
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  checkly:
    runs-on: ubuntu-latest
    needs:
      - deploy
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Deploy Checkly checks
        run: yarn checkly:deploy --force
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_TOKEN }}
          CHECKLY_ACCOUNT_ID: ${{ secrets.CHECKLY_ACCOUNT_ID }}
